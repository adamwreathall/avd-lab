hostname dc1-leaf1-server1
!
no aaa root
!
username arista privilege 15 role network-admin secret arista
!
vrf instance HOST_VLAN11
!
vrf instance HOST_VLAN21
!
vrf instance MGMT
!
ip routing vrf HOST_VLAN11
ip routing vrf HOST_VLAN21
no ip routing vrf MGMT
!
ip name-server vrf MGMT 8.8.8.8
dns domain avd.lab
!
platform tfa
   personality arfa
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 0.pool.ntp.org
ntp server vrf MGMT 1.pool.ntp.org
ntp server vrf MGMT 2.pool.ntp.org
!
service routing protocols model multi-agent
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
vlan 11
!
vlan 21
!
vlan 4092
!
interface Port-Channel1
   description Bond1_to_dc1-leaf1
   switchport trunk native vlan 4092
   switchport trunk allowed vlan 11,21,4092
   switchport mode trunk
   spanning-tree portfast edge
!
interface Ethernet1
   description PCI1_to_dc1-leaf1a_Eth5
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description PCI2_to_dc1-leaf1b_Eth5
   no shutdown
   channel-group 1 mode active
!
interface Ethernet3
   description iLO_to_dc1-leaf1c_Eth5
   no shutdown
!
interface Management1
   vrf MGMT
      ip address 172.16.1.181/24
!
interface Vlan11
   description HOST_VLAN11
   no shutdown
   vrf HOST_VLAN11
   ip address 10.10.11.181/24
!
interface Vlan21
   description HOST_VLAN21
   no shutdown
   vrf HOST_VLAN21
   ip address 10.10.21.181/24
!
ip route vrf HOST_VLAN11 0.0.0.0/0 10.10.11.1
ip route vrf HOST_VLAN21 0.0.0.0/0 10.10.21.1
ip route vrf MGMT 0.0.0.0/0 172.16.1.1
!
end
