hostname dc1-leaf2-server1
!
no aaa root
!
username arista privilege 15 role network-admin secret arista
!
vrf instance MGMT
!
ip routing
no ip routing vrf MGMT
!
ip name-server vrf MGMT 8.8.8.8
dns domain avd.lab
!
platform tfa
   personality arfa
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 0.pool.ntp.org
ntp server vrf MGMT 1.pool.ntp.org
ntp server vrf MGMT 2.pool.ntp.org
!
service routing protocols model multi-agent
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
vlan 110
   name VRF10_TRANSIT
!
vlan 120
   name VRF11_TRANSIT
!
vlan 4092
!
interface Port-Channel1
   description Bond1_to_dc1-leaf2
   switchport trunk native vlan 4092
   switchport trunk allowed vlan 110,120,4092
   switchport mode trunk
   spanning-tree portfast edge
!
interface Ethernet1
   description PCI1_to_dc1-leaf2a_Eth5
   no shutdown
   channel-group 1 mode active
!
interface Ethernet2
   description PCI2_to_dc1-leaf2b_Eth5
   no shutdown
   channel-group 1 mode active
!
interface Ethernet3
   description iLO_to_dc1-leaf2c_Eth5
   no shutdown
!
interface Management1
   vrf MGMT
      ip address 172.16.1.182/24
!
interface Vlan110
   description TRANSIT_VRF10
   no shutdown
   ip address 10.10.110.182/24
!
interface Vlan120
   description TRANSIT_VRF11
   no shutdown
   ip address 10.10.120.182/24
!
ip route vrf MGMT 0.0.0.0/0 172.16.1.1
!
ip prefix-list PL-DEFAULT-ONLY
   seq 10 permit 0.0.0.0/0
!
ip prefix-list PL-VRF10-IN
   seq 10 permit 10.10.11.0/24
   seq 20 permit 10.10.12.0/24
   seq 30 permit 10.255.10.0/27
!
ip prefix-list PL-VRF11-IN
   seq 10 permit 10.10.21.0/24
   seq 20 permit 10.10.22.0/24
   seq 30 permit 10.255.11.0/27
!
route-map RM-DEFAULT-OUT permit 10
   match ip address prefix-list PL-DEFAULT-ONLY
!
route-map RM-VRF10-IN permit 10
   match ip address prefix-list PL-VRF10-IN
!
route-map RM-VRF11-IN permit 10
   match ip address prefix-list PL-VRF11-IN
!
router bgp 65200
   router-id 10.10.110.182
   no bgp default ipv4-unicast
   maximum-paths 2
   !
   neighbor LEAF2-VRF10-PEERS peer group
   neighbor LEAF2-VRF10-PEERS remote-as 65102
   neighbor LEAF2-VRF10-PEERS default-originate
   neighbor LEAF2-VRF10-PEERS route-map RM-VRF10-IN in
   neighbor LEAF2-VRF10-PEERS route-map RM-DEFAULT-OUT out
   neighbor LEAF2-VRF10-PEERS send-community
   !
   neighbor 10.10.110.2 peer group LEAF2-VRF10-PEERS
   neighbor 10.10.110.2 description dc1-leaf2a_Vlan110
   neighbor 10.10.110.3 peer group LEAF2-VRF10-PEERS
   neighbor 10.10.110.3 description dc1-leaf2b_Vlan110
   !
   neighbor LEAF2-VRF11-PEERS peer group
   neighbor LEAF2-VRF11-PEERS remote-as 65102
   neighbor LEAF2-VRF11-PEERS default-originate
   neighbor LEAF2-VRF11-PEERS route-map RM-VRF11-IN in
   neighbor LEAF2-VRF11-PEERS route-map RM-DEFAULT-OUT out
   neighbor LEAF2-VRF11-PEERS send-community
   !
   neighbor 10.10.120.2 peer group LEAF2-VRF11-PEERS
   neighbor 10.10.120.2 description dc1-leaf2a_Vlan120
   neighbor 10.10.120.3 peer group LEAF2-VRF11-PEERS
   neighbor 10.10.120.3 description dc1-leaf2b_Vlan120
   !
   address-family ipv4
      neighbor LEAF2-VRF10-PEERS activate
      neighbor LEAF2-VRF11-PEERS activate
!
end
